[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-language"
dynamic = ["version"]
description = "The Aether language runtime and command-line interface"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy==2.4.2",
    "scipy==1.17.1",
    "sympy==1.14.0",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
release = [
    "build>=1.2,<2",
]

[project.scripts]
aether = "aether.cli:main"
aether-lsp = "aether_lsp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
py-modules = [
    "autocomplete_engine",
    "command_catalog",
    "document_symbols",
    "plot_backend",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "aether.version.PACKAGE_VERSION" }

[tool.setuptools.data-files]
"share/doc/aether" = [
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "docs/aether/AETHER_LANGUAGE_SPEC_V1.md",
    "docs/aether/AETHER_NATIVE_PROFILE_V1.md",
    "docs/aether/AETHER_FRONTEND_EXPERIMENTS.md",
    "docs/aether/AETHER_DIAGNOSTICS.md",
    "docs/aether/AETHER_1_0_0_RC4_RELEASE_NOTES.md",
    "docs/compiler/exceptions/EXCEPTION_PROMOTION_EVIDENCE.md",
    "docs/compiler/exceptions/EXCEPTION_PROMOTION_DIFFERENTIAL_REPORT.json",
]
"share/aether/examples" = [
    "examples/*.ae",
    "examples/README.md",
    "examples/v1_examples_manifest.json",
]
"share/aether/examples/LeetCode" = ["examples/LeetCode/*.ae"]
"share/aether/examples/ProbandoNR" = ["examples/ProbandoNR/*.ae"]
"share/aether/examples/Sorts" = ["examples/Sorts/*.ae"]
"share/aether/examples/aggregate_collections" = ["examples/aggregate_collections/*.ae"]
"share/aether/examples/classes" = ["examples/classes/*.ae"]
"share/aether/examples/expense_tracker" = ["examples/expense_tracker/*.ae", "examples/expense_tracker/*.md"]
"share/aether/examples/interactive" = ["examples/interactive/*.ae"]
"share/aether/examples/ir" = ["examples/ir/*.ae"]
"share/aether/examples/linear_algebra" = ["examples/linear_algebra/*.ae"]
"share/aether/examples/lists" = ["examples/lists/*.ae"]
"share/aether/examples/llvm" = ["examples/llvm/*.ae"]
"share/aether/examples/minimos_cuadrados" = ["examples/minimos_cuadrados/*.ae"]
"share/aether/examples/nonlinear_systems" = ["examples/nonlinear_systems/*.ae"]
"share/aether/examples/numerical_methods" = ["examples/numerical_methods/*.ae", "examples/numerical_methods/*.md"]
"share/aether/examples/structs" = ["examples/structs/*.ae"]
"share/aether/corpus/exceptions" = [
    "corpus/exceptions/README.md",
    "corpus/exceptions/catalog.json",
]
"share/aether/corpus/exceptions/positive" = ["corpus/exceptions/positive/*.ae"]
"share/aether/corpus/exceptions/negative" = ["corpus/exceptions/negative/*.ae"]

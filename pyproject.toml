[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-language"
dynamic = ["version"]
description = "The Aether language runtime and command-line interface"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy==2.4.2",
    "scipy==1.17.1",
    "sympy==1.14.0",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
studio = [
    "PySide6==6.10.2",
    "platformdirs==4.4.0",
]
release = [
    "build>=1.2,<2",
]

[project.scripts]
aether = "aether.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
py-modules = [
    "app_preferences",
    "autocomplete_engine",
    "command_catalog",
    "document_symbols",
    "language_runtime",
    "main",
    "numeric_format",
    "plot_backend",
    "qt_app",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "aether.version.PACKAGE_VERSION" }

[tool.setuptools.data-files]
"share/doc/aether" = [
    "docs/aether/AETHER_LANGUAGE_SPEC_V1.md",
    "docs/aether/AETHER_NATIVE_PROFILE_V1.md",
]

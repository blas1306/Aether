[workspace]
members = [
    "crates/aether-ir",
    "crates/aether-ir-verifier",
    "crates/aether-python",
    "crates/aether-verifier",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.dev]
debug = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

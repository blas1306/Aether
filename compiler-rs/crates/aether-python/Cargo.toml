[package]
name = "aether-python"
description = "Python integration boundary for native Aether compiler components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "_aether_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
productive-distribution = []

[lints]
workspace = true

[dependencies]
aether-ir = { path = "../aether-ir" }
aether-verifier = { path = "../aether-verifier" }
pyo3 = "0.29.2"
serde_json = "1"

# TEST-QUALIFICATION-V1 inventory. Commands run from compiler-next.
version = 1
profiles = ["core", "conformance", "oal", "full"]

[[suite]]
id = "runner:self-tests"
kind = "runner-test"
primary_responsibility = "qualification runner behavior"
secondary_responsibilities = ["manifest validation","process-tree timeout","JSON reporting"]
profiles = ["core","conformance","oal","full"]
platform = ["any"]
optimization = "not applicable"
timeout_seconds = 120
owner = "compiler-infrastructure"
command = ["python3","-m","unittest","tests/qualification_runner_test.py"]
full_gate = true

[[suite]]
id = "cargo:aether-frontend:lib"
kind = "cargo-test"
crate = "aether-frontend"
target = "lib"
target_kind = "lib"
primary_responsibility = "aether-frontend internal invariants"
secondary_responsibilities = ["compiler core"]
profiles = ["core","conformance","full"]
platform = ["any"]
optimization = "not applicable"
timeout_seconds = 300
owner = "compiler-frontend"
command = ["cargo","test","-p","aether-frontend","--lib"]

[[suite]]
id = "cargo:aether-middle:lib"
kind = "cargo-test"

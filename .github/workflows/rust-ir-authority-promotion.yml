      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-3-python-3.13, path: qualification/rust-ir-3/python-3.13.json}

  python-3-14:
    name: python-3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install 'maturin>=1.9.4,<2' 'build>=1.2,<2'
      - run: python -m pip wheel --no-build-isolation --no-deps compiler-rs/distributions/aether-compiler-core --wheel-dir native-dist
      - run: python -m build --wheel --outdir language-dist
      - shell: bash
        run: >-
          python scripts/qualify_rust_ir_3_clean_consumer.py --native-wheel native-dist/*.whl --language-wheel language-dist/*.whl
          --kind python_compatibility --role python --platform linux-x86_64 --python-minor 3.14
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}" --output qualification/rust-ir-3/python-3.14.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-3-python-3.14, path: qualification/rust-ir-3/python-3.14.json}

  aggregate-fail-closed:
    if: always()
    needs:
      - prerequisite-rust-ir-2
      - authority-contract
      - directed-false-negative-search
      - directed-rust-stricter-search
      - positive-regression
      - mutation-campaign
      - critical-irv041
      - product-authority-provenance
      - no-python-rescue
      - lifecycle-boundary
      - packaged-clean-consumer
      - source-development-install
      - next-request-recovery
      - transport-continuity
      - deep-stress
      - performance-characterization
      - platform-linux-x86_64
      - platform-windows-x86_64
      - platform-macos-x86_64
      - platform-macos-arm64
      - python-3-11
      - python-3-12
      - python-3-13
      - python-3-14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with:
          path: qualification/rust-ir-3/downloads
      - name: Record official APIs and ZIP digests
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/rust-ir-3/{zips,aggregate}
          gh api 'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100' > qualification/rust-ir-3/artifacts-api.json
          gh api 'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100' > qualification/rust-ir-3/jobs-api.json
          test "$(jq '.total_count' qualification/rust-ir-3/artifacts-api.json)" = 24
          jq -r '.artifacts[] | [.id,.name] | @tsv' qualification/rust-ir-3/artifacts-api.json |
          while IFS=$'\t' read -r id name; do
            gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > "qualification/rust-ir-3/zips/${name}.zip"
          done
      - run: >-
          python scripts/build_rust_ir_3_artifact_manifest.py
          --artifact-root qualification/rust-ir-3/downloads
          --zip-root qualification/rust-ir-3/zips
          --artifacts-api qualification/rust-ir-3/artifacts-api.json
          --jobs-api qualification/rust-ir-3/jobs-api.json
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-3/aggregate/artifact-manifest.json
      - run: >-
          python scripts/check_rust_ir_3_authority_promotion.py
          --manifest qualification/rust-ir-3/aggregate/artifact-manifest.json
          --output qualification/rust-ir-3/aggregate/decision.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ir-3-aggregate
          path: qualification/rust-ir-3

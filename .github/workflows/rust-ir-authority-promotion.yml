      - run: python -m pip install -r requirements.txt --group dev
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --package aether-ir-verifier
      - run: >-
          python scripts/qualify_rust_ir_3_authority_promotion.py --mode false-negative

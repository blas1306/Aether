name: rust-ir-3-authority-promotion

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  AETHER_COMPILER_CORE_BUILD_IDENTITY: ${{ github.sha }}
  PYTHONUNBUFFERED: "1"

jobs:
  prerequisite-rust-ir-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Replay every official RUST-IR-2 artifact
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/rust-ir-3/r2/{zips,aggregate}
          gh api 'repos/${{ github.repository }}/actions/runs/33465504645/artifacts?per_page=100' > qualification/rust-ir-3/r2/artifacts-api.json
          gh api 'repos/${{ github.repository }}/actions/runs/33465504645/jobs?per_page=100' > qualification/rust-ir-3/r2/jobs-api.json
          test "$(jq '.total_count' qualification/rust-ir-3/r2/artifacts-api.json)" = 21
          jq -r '.artifacts[] | [.id,.name,.digest] | @tsv' qualification/rust-ir-3/r2/artifacts-api.json |
          while IFS=$'\t' read -r id name digest; do
            gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > "qualification/rust-ir-3/r2/zips/${name}.zip"
            actual="sha256:$(sha256sum "qualification/rust-ir-3/r2/zips/${name}.zip" | cut -d' ' -f1)"
            test "${actual}" = "${digest}"
          done
          unzip -q qualification/rust-ir-3/r2/zips/rust-ir-2-aggregate.zip -d qualification/rust-ir-3/r2/aggregate
          python scripts/check_rust_ir_2_pre_lifecycle_shadow_qualification.py \
            --manifest qualification/rust-ir-3/r2/aggregate/artifact-manifest.json \
            --output qualification/rust-ir-3/r2/replay-decision.json
          test "$(jq -r '.decision' qualification/rust-ir-3/r2/replay-decision.json)" = RUST_INITIAL_IR_PRE_LIFECYCLE_SHADOW_QUALIFIED
      - run: >-
          python scripts/qualify_rust_ir_3_authority_promotion.py --mode prerequisite
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --prerequisite-decision qualification/rust-ir-3/r2/replay-decision.json
          --prerequisite-artifacts-api qualification/rust-ir-3/r2/artifacts-api.json
          --prerequisite-jobs-api qualification/rust-ir-3/r2/jobs-api.json
          --output qualification/rust-ir-3/prerequisite.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-3-prerequisite, path: qualification/rust-ir-3/prerequisite.json}

  authority-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: >-
          python scripts/qualify_rust_ir_3_authority_promotion.py --mode audit
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-3/contract.json
      - uses: actions/upload-artifact@v4

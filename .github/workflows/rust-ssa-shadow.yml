name: rust-ssa-authority
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
jobs:
  qualify-platform:
    name: rust-authority-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-latest, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: windows-x86_64, os: windows-latest, executable: compiler-rs/target/release/aether-ssa-shadow.exe}
          - {platform: macos-arm64, os: macos-15, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: macos-x86_64, os: macos-15-intel, executable: compiler-rs/target/release/aether-ssa-shadow}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest build
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --release --locked --package aether-verifier --bin aether-ssa-shadow
      - run: python -m build --wheel --outdir python-dist
      - name: Qualify Rust authority from clean wheel and packaged companion
        run: >-
          python scripts/qualify_rust_ssa_authority_platform.py
          --platform "${{ matrix.platform }}"
          --executable "${{ matrix.executable }}"
          --wheel python-dist --output-dir qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssa-authority-qualification-${{ matrix.platform }}
          path: qualification

  rust-authority-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: >-
          python scripts/qualify_rust_ssa_authority_operational.py
          --output qualification/rust-ssa-authority-soak.json
      - uses: actions/upload-artifact@v4
        with:
          name: ssa-authority-soak
          path: qualification/rust-ssa-authority-soak.json

  python-authority-rust-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -r requirements.txt pytest
      - run: >-
          python -m pytest -q tests/aether/test_rust_ssa_authority_promotion.py
          -k both_rollback_selections

  python-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -r requirements.txt pytest
      - run: >-
          python -m pytest -q tests/aether/test_rust_ssa_shadow_mode.py
          -k python_only_rollback

  aggregate:
    needs: [qualify-platform, rust-authority-soak, python-authority-rust-shadow, python-only]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {pattern: ssa-authority-qualification-*, path: imported}
      - uses: actions/download-artifact@v4
        with: {name: ssa-authority-soak, path: soak}
      - name: Flatten evidence-only native reports
        shell: python
        run: |
          from pathlib import Path
          import shutil
          evidence = Path("evidence")
          evidence.mkdir()
          reports = sorted(Path("imported").rglob("*.json"))
          for report in reports:
              if report.name.startswith(("linux-", "windows-", "macos-")):
                  shutil.copyfile(report, evidence / report.name)
          assert len(list(evidence.glob("*.json"))) == 4
      - name: Require promoted authority revision
        run: >-
          python scripts/check_rust_ssa_authority_promotion.py
          --platform-evidence evidence
          --soak-evidence soak/rust-ssa-authority-soak.json
          --output qualification/rust_ssa_authority_promotion.json
          --require-promoted
      - uses: actions/upload-artifact@v4
        with:
          name: rust-ssa-authority-promotion
          path: |
            evidence
            qualification

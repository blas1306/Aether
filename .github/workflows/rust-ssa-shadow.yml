name: rust-ssa-shadow
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
jobs:
  qualify-platform:
    name: shadow-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-latest, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: windows-x86_64, os: windows-latest, executable: compiler-rs/target/release/aether-ssa-shadow.exe}
          - {platform: macos-arm64, os: macos-15, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: macos-x86_64, os: macos-15-intel, executable: compiler-rs/target/release/aether-ssa-shadow}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest build
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --release --locked --package aether-verifier --bin aether-ssa-shadow
      - run: python -m build --wheel --outdir python-dist
      - name: Qualify clean wheel and packaged companion
        run: >-
          python scripts/qualify_rust_ssa_shadow_platform.py
          --platform "${{ matrix.platform }}"
          --executable "${{ matrix.executable }}"
          --wheel python-dist --output-dir qualification
      - name: Full Linux soak, 1000-request session, and 128-request concurrency
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          python scripts/qualify_rust_ssa_shadow_operational.py
          cp docs/compiler/rust_ssa_shadow_operational_qualification.json qualification/local-soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssa-shadow-qualification-${{ matrix.platform }}
          path: qualification
  aggregate:
    needs: qualify-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {pattern: ssa-shadow-qualification-*, path: imported}
      - run: >-
          python scripts/check_rust_ssa_shadow_operational_qualification.py
          --flatten-downloaded imported --evidence-dir evidence
      - run: >-
          python scripts/check_rust_ssa_shadow_operational_qualification.py
          --evidence-dir evidence
          --soak imported/ssa-shadow-qualification-linux-x86_64/local-soak.json
          --output qualification/rust_ssa_shadow_operational_qualification.json
          --require-qualified
      - uses: actions/upload-artifact@v4
        with:
          name: rust-ssa-shadow-operational-qualification
          path: |
            evidence
            qualification

name: rust-ssa-authority-promotion-v2
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  rust-4-5-shadow-independent-default:
    name: rust-4.5-production-default-no-python-shadow
    runs-on: ubuntu-latest
    env:
      LSAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: >-
          python -m pip install -r requirements.txt pytest
          'setuptools>=77' 'wheel>=0.45'
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --package aether-verifier --bin aether-ssa-shadow
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --release --locked --package aether-ir-verifier
      - name: New production-default policy, ordering, provenance, and rollback
        run: >-
          python -m pytest -q
          tests/aether/test_rust_ssa_shadow_independent_production_promotion.py
          tests/aether/test_rust_ssa_shadow_independent_qualification.py
      - name: Full repository suite under shadow-independent production default
        run: >-
          python -m pytest -q tests
          --rust-ssa-authority-qualification-executable
          compiler-rs/target/debug/aether-ssa-shadow

  rust-4-5-mandatory-differential-shadow:
    name: rust-4.5-ci-differential-rust-refinement-python-shadow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --package aether-verifier --bin aether-ssa-shadow
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --example verify_owned_ssa_v2
      - name: Mandatory Python builder and canonical mismatch fail-closed proof
        env:
          AETHER_SSA_AUTHORITY_MODE: rust_ssa_authority_python_shadow
        run: >-
          python -m pytest -q
          tests/aether/test_rust_ssa_shadow_independent_production_promotion.py
          -k differential
      - name: Historical, adversarial, mutation, deep-CFG and RUST-4.x A/B differential
        run: >-
          python scripts/qualify_rust_ssa_shadow_independent_production_promotion.py
          --revision "${{ github.sha }}"
          --companion compiler-rs/target/debug/aether-ssa-shadow
          --rust-verifier compiler-rs/target/debug/examples/verify_owned_ssa_v2
          --qualification-scope differential
          --output qualification/rust45/differential.json
          --report qualification/rust45/differential.md
      - name: Differential qualification decision gate
        run: >-
          python scripts/check_rust_ssa_differential_qualification.py
          --evidence qualification/rust45/differential.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-4.5-differential-shadow
          path: qualification/rust45

  rust-4-5-clean-install-platform:
    name: rust-4.5-shadow-independent-clean-install-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-latest, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: windows-x86_64, os: windows-latest, executable: compiler-rs/target/release/aether-ssa-shadow.exe}
          - {platform: macos-arm64, os: macos-15, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: macos-x86_64, os: macos-15-intel, executable: compiler-rs/target/release/aether-ssa-shadow}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest build
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --release --locked --package aether-verifier --bin aether-ssa-shadow
      - run: python -m build --wheel --outdir python-dist
      - name: Clean install uses refinement-verified default with no Python shadow
        run: >-
          python scripts/qualify_rust_ssa_authority_platform.py
          --shadow-independent-promotion
          --revision "${{ github.sha }}"
          --platform "${{ matrix.platform }}"
          --executable "${{ matrix.executable }}"
          --wheel python-dist
          --output-dir qualification/rust45/platforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-4.5-clean-install-${{ matrix.platform }}
          path: qualification/rust45/platforms

  rust-4-4-platform:
    name: rust-4.4-shadow-independent-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-latest, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: windows-x86_64, os: windows-latest, executable: compiler-rs/target/release/aether-ssa-shadow.exe}
          - {platform: macos-arm64, os: macos-15, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: macos-x86_64, os: macos-15-intel, executable: compiler-rs/target/release/aether-ssa-shadow}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --release --locked --package aether-verifier --bin aether-ssa-shadow
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --example verify_owned_ssa_v2
      - name: RUST-4.4 qualification-only path contracts
        run: python -m pytest -q tests/aether/test_rust_ssa_shadow_independent_qualification.py
      - name: RUST-4.4 exact-platform qualification smoke
        run: >-
          python scripts/qualify_rust_ssa_shadow_independent.py
          --smoke --companion "${{ matrix.executable }}"
          --output "qualification/rust44/${{ matrix.platform }}.json"
          --report "qualification/rust44/${{ matrix.platform }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-4.4-${{ matrix.platform }}
          path: qualification/rust44

  rust-4-4-full-local-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --release --locked --package aether-verifier --bin aether-ssa-shadow
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --example verify_owned_ssa_v2
      - run: >-
          python scripts/qualify_rust_ssa_shadow_independent.py
          --companion compiler-rs/target/release/aether-ssa-shadow
          --output qualification/rust44/full-linux-x86_64.json
          --report qualification/rust44/full-linux-x86_64.md
      - run: >-
          python scripts/check_rust_ssa_shadow_independent.py
          --evidence qualification/rust44/full-linux-x86_64.json
          --report qualification/rust44/full-linux-x86_64.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-4.4-full-linux-x86_64
          path: qualification/rust44

  qualify-platform:
    name: rust-authority-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-latest, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: windows-x86_64, os: windows-latest, executable: compiler-rs/target/release/aether-ssa-shadow.exe}
          - {platform: macos-arm64, os: macos-15, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: macos-x86_64, os: macos-15-intel, executable: compiler-rs/target/release/aether-ssa-shadow}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest build
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --release --locked --package aether-verifier --bin aether-ssa-shadow
      - name: RUST-4.2 refinement production integration contracts
        run: >-
          python -m pytest -q
          tests/aether/test_rust_ssa_refinement_production_integration.py
          tests/aether/test_rust_ssa_independent_refinement_verifier.py
      - name: RUST-4.2 checked evidence gate
        run: python scripts/check_rust_ssa_refinement_production_integration.py
      - name: RUST-4.3 shadow redundancy qualification contracts
        run: python -m pytest -q tests/aether/test_rust_ssa_shadow_redundancy_qualification.py
      - name: RUST-4.3 checked evidence gate
        run: python scripts/check_rust_ssa_shadow_redundancy.py
      - run: python -m build --wheel --outdir python-dist
      - name: Clean-install, promotion-fixtures, three-mode, handoff, rollback
        run: >-
          python scripts/qualify_rust_ssa_authority_platform.py
          --revision "${{ github.sha }}"
          --platform "${{ matrix.platform }}"
          --executable "${{ matrix.executable }}"
          --wheel python-dist --output-dir qualification/platforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-${{ matrix.platform }}
          path: qualification/platforms

  promotion-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: >-
          python scripts/qualify_rust_ssa_authority_promotion_fixtures.py
          --revision "${{ github.sha }}" --build
          --output qualification/promotion_fixtures.json
      - uses: actions/upload-artifact@v4
        with: {name: promotion-fixtures, path: qualification/promotion_fixtures.json}

  historical-116:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --package aether-verifier --bin aether-ssa-shadow
      - run: >-
          python scripts/qualify_rust_ssa_authority_historical.py
          --revision "${{ github.sha }}"
          --executable compiler-rs/target/debug/aether-ssa-shadow
          --output qualification/historical.json
      - uses: actions/upload-artifact@v4
        with: {name: historical-116, path: qualification/historical.json}

  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: >-
          python scripts/qualify_rust_ssa_lowering_adversarial.py
          --revision "${{ github.sha }}"
          --output qualification/adversarial.json
      - uses: actions/upload-artifact@v4
        with: {name: adversarial, path: qualification/adversarial.json}

  deep-cfg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: >-
          python scripts/qualify_rust_ssa_authority_deep_cfg.py
          --revision "${{ github.sha }}" --build
          --output qualification/deep_cfg.json
      - uses: actions/upload-artifact@v4
        with: {name: deep-cfg, path: qualification/deep_cfg.json}

  authority-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: >-
          python scripts/qualify_rust_ssa_authority_operational.py
          --revision "${{ github.sha }}"
          --output qualification/soak.json
      - run: >-
          python scripts/qualify_rust_ssa_authority_requalification_operational.py
          --revision "${{ github.sha }}"
          --soak qualification/soak.json
          --output qualification/operational.json
      - uses: actions/upload-artifact@v4
        with:
          name: authority-soak
          path: |
            qualification/soak.json
            qualification/operational.json

  full-suite-rust-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: >-
          python -m pip install -r requirements.txt pytest
          'setuptools>=77' 'wheel>=0.45'
      - run: >-
          python scripts/qualify_rust_ssa_authority_full_suite.py
          --revision "${{ github.sha }}" --build
          --output qualification/full_suite.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-rust-default
          path: |
            qualification/full_suite.json
            qualification/full_suite_pytest.log

  production-stabilization-operational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: >-
          python scripts/qualify_rust_ssa_production_stabilization.py
          --revision "${{ github.sha }}" --build
          --output qualification/operational.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-stabilization-operational
          path: qualification/operational.json

  production-stabilization-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --package aether-verifier --bin aether-ssa-shadow
      - run: >-
          python scripts/qualify_rust_ssa_production_regressions.py
          --revision "${{ github.sha }}"
          --executable compiler-rs/target/debug/aether-ssa-shadow
          --output qualification/regressions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-stabilization-regressions
          path: qualification/regressions.json

  production-stabilization-full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: >-
          python -m pip install -r requirements.txt pytest
          'setuptools>=77' 'wheel>=0.45'
      - run: >-
          python scripts/qualify_rust_ssa_authority_full_suite.py
          --revision "${{ github.sha }}" --build --milestone RUST-3.7a
          --output qualification/full_suite.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-stabilization-full-suite
          path: |
            qualification/full_suite.json
            qualification/full_suite_pytest.log

  production-stabilization-platform:
    name: rust-stabilization-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-latest, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: windows-x86_64, os: windows-latest, executable: compiler-rs/target/release/aether-ssa-shadow.exe}
          - {platform: macos-arm64, os: macos-15, executable: compiler-rs/target/release/aether-ssa-shadow}
          - {platform: macos-x86_64, os: macos-15-intel, executable: compiler-rs/target/release/aether-ssa-shadow}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest build
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --release --locked --package aether-verifier --bin aether-ssa-shadow
      - run: python -m build --wheel --outdir python-dist
      - run: >-
          python scripts/qualify_rust_ssa_authority_platform.py
          --production-stabilization --revision "${{ github.sha }}"
          --platform "${{ matrix.platform }}"
          --executable "${{ matrix.executable }}"
          --wheel python-dist --output-dir qualification/platforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-stabilization-platform-${{ matrix.platform }}
          path: qualification/platforms

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --package aether-verifier --bin aether-ssa-shadow
      - run: >-
          python scripts/measure_rust_ssa_authority_performance.py
          --revision "${{ github.sha }}"
          --executable compiler-rs/target/debug/aether-ssa-shadow
          --output qualification/performance.json
      - uses: actions/upload-artifact@v4
        with: {name: performance, path: qualification/performance.json}

  python-authority-rust-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -r requirements.txt pytest
      - run: >-
          python -m pytest -q tests/aether/test_rust_ssa_authority_promotion.py
          -k both_rollback_selections

  python-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -r requirements.txt pytest
      - run: >-
          python -m pytest -q tests/aether/test_rust_ssa_shadow_mode.py
          -k python_only_rollback

  aggregate:
    needs:
      - qualify-platform
      - promotion-fixtures
      - historical-116
      - adversarial
      - deep-cfg
      - authority-soak
      - full-suite-rust-default
      - performance
      - python-authority-rust-shadow
      - python-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {path: imported}
      - name: Assemble evidence without inventing platform results
        shell: python
        run: |
          from pathlib import Path
          import json
          import shutil
          evidence = Path("evidence")
          (evidence / "platforms").mkdir(parents=True)
          names = {
              "promotion_fixtures.json", "historical.json", "adversarial.json",
              "deep_cfg.json", "soak.json", "operational.json",
              "full_suite.json", "performance.json",
          }
          for report in Path("imported").rglob("*.json"):
              value = json.loads(report.read_text(encoding="utf-8"))
              if report.name.startswith(("linux-", "windows-", "macos-")) and value.get("milestone") != "RUST-3.6-V2":
                  continue
              if report.name in names and value.get("milestone") == "RUST-3.7a":
                  continue
              destination = (
                  evidence / "platforms" / report.name
                  if report.name.startswith(("linux-", "windows-", "macos-"))
                  else evidence / report.name
              )
              shutil.copyfile(report, destination)
          assert names <= {path.name for path in evidence.glob("*.json")}
          assert len(list((evidence / "platforms").glob("*.json"))) == 4
      - name: Require exact-revision RUST-3.6-V2 promotion
        run: >-
          python scripts/check_rust_ssa_authority_promotion_v2.py
          --revision "${{ github.sha }}" --evidence-dir evidence
          --output qualification/rust_ssa_authority_promotion_v2.json
          --require-promoted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ssa-authority-promotion-v2
          path: |
            evidence
            qualification

  production-stabilization-aggregate:
    needs:
      - promotion-fixtures
      - deep-cfg
      - production-stabilization-operational
      - production-stabilization-regressions
      - production-stabilization-full-suite
      - production-stabilization-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {path: imported}
      - name: Assemble fresh RUST-3.7a evidence
        shell: python
        run: |
          from pathlib import Path
          import json
          import shutil
          evidence = Path("evidence")
          (evidence / "platforms").mkdir(parents=True)
          wanted = {
              "promotion_fixtures.json", "deep_cfg.json", "operational.json",
              "regressions.json", "full_suite.json",
          }
          for report in Path("imported").rglob("*.json"):
              value = json.loads(report.read_text(encoding="utf-8"))
              if report.name.startswith(("linux-", "windows-", "macos-")):
                  if value.get("milestone") == "RUST-3.7a":
                      shutil.copyfile(report, evidence / "platforms" / report.name)
              elif report.name in wanted:
                  if report.name in {"promotion_fixtures.json", "deep_cfg.json"} or value.get("milestone") == "RUST-3.7a":
                      shutil.copyfile(report, evidence / report.name)
          assert wanted <= {path.name for path in evidence.glob("*.json")}
          assert len(list((evidence / "platforms").glob("*.json"))) == 4
      - name: Require exact-revision production stabilization
        run: >-
          python scripts/check_rust_ssa_production_stabilization.py
          --revision "${{ github.sha }}" --evidence-dir evidence
          --output qualification/rust_ssa_production_stabilization.json
          --require-stabilized
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ssa-production-stabilization
          path: |
            evidence
            qualification/rust_ssa_production_stabilization.json

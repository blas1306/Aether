name: rust-ir-2-pre-lifecycle-shadow-qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  AETHER_COMPILER_CORE_BUILD_IDENTITY: ${{ github.sha }}
  PYTHONUNBUFFERED: "1"

jobs:
  contract-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: >-
          python scripts/qualify_rust_ir_2_pre_lifecycle.py --mode contract
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/contract.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-contract, path: qualification/rust-ir-2/contract.json}

  rust-verifier-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85", components: "rustfmt, clippy"}
      - run: python -m pip install -r requirements.txt pytest
      - run: cargo fmt --all --check
        working-directory: compiler-rs
      - run: cargo test --workspace --locked
        working-directory: compiler-rs
      - run: >-
          python -m pytest -q
          tests/aether/test_rust_ir_1_pre_lifecycle_admission.py
          tests/aether/test_rust_ir_2_pre_lifecycle_shadow_qualification.py
      - run: >-
          python scripts/check_rust_ir_2_clippy_delta.py
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/rust-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-rust-validation, path: qualification/rust-ir-2/rust-validation.json}

  valid-corpus-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest 'maturin>=1.9.4,<2'
      - run: python -m pip install compiler-rs/distributions/aether-compiler-core
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --package aether-ir-verifier
      - run: >-
          python scripts/qualify_rust_ir_2_pre_lifecycle.py --mode valid-corpus
          --rust-verifier compiler-rs/target/debug/aether-ir-verifier
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/valid-corpus.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-valid-corpus, path: qualification/rust-ir-2/valid-corpus.json}

  mutation-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest 'maturin>=1.9.4,<2'
      - run: python -m pip install compiler-rs/distributions/aether-compiler-core
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --package aether-ir-verifier
      - run: >-
          python scripts/qualify_rust_ir_2_pre_lifecycle.py --mode mutations
          --rust-verifier compiler-rs/target/debug/aether-ir-verifier
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/mutations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-mutations, path: qualification/rust-ir-2/mutations.json}

  critical-irv041-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --package aether-ir-verifier
      - run: >-
          python scripts/qualify_rust_ir_2_pre_lifecycle.py --mode irv041
          --rust-verifier compiler-rs/target/debug/aether-ir-verifier
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/irv041.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-irv041, path: qualification/rust-ir-2/irv041.json}

  production-pre-lifecycle-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt 'maturin>=1.9.4,<2'
      - run: python -m pip install compiler-rs/distributions/aether-compiler-core
      - run: python -m pip install -e . --no-deps
      - run: >-
          python scripts/rust_ir_2_product_probe.py --mode provenance
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/provenance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-provenance, path: qualification/rust-ir-2/provenance.json}

  lifecycle-boundary-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest 'maturin>=1.9.4,<2'
      - run: python -m pip install compiler-rs/distributions/aether-compiler-core
      - run: python -m pip install -e . --no-deps
      - run: >-
          python -m pytest -q
          tests/aether/test_const_collection_borrowed_for.py::test_borrow_to_owned_local_and_return_survive_iteration_and_container_clear
          tests/aether/test_differential_parity.py::test_profile_22_ast_native_observations_match_at_every_optimization_level
      - run: >-
          python scripts/rust_ir_2_product_probe.py --mode lifecycle
          --critical-tests-passed --revision "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/lifecycle-boundary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-lifecycle-boundary, path: qualification/rust-ir-2/lifecycle-boundary.json}

  packaged-clean-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install 'maturin>=1.9.4,<2' 'build>=1.2,<2'
      - run: python -m pip wheel --no-build-isolation --no-deps compiler-rs/distributions/aether-compiler-core --wheel-dir native-dist
      - run: python -m build --wheel --outdir language-dist
      - shell: bash
        run: >-
          python scripts/qualify_rust_ir_2_clean_consumer.py
          --native-wheel native-dist/*.whl --language-wheel language-dist/*.whl
          --kind packaged_clean_consumer --role dedicated --platform linux-x86_64
          --python-minor 3.13 --revision "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/packaged.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-packaged-consumer, path: qualification/rust-ir-2/packaged.json}

  source-development-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt --group dev 'maturin>=1.9.4,<2'
      - run: python -m pip install compiler-rs/distributions/aether-compiler-core
      - run: python -m pip install -e . --no-deps
      - run: >-
          cargo build --manifest-path compiler-rs/Cargo.toml --locked
          --package aether-verifier --bin aether-ssa-shadow
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --release --package aether-ir-verifier
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p qualification/rust-ir-2
          python -m pytest -q tests | tee qualification/rust-ir-2/full-pytest.log
      - run: >-
          python scripts/rust_ir_2_product_probe.py --mode environment
          --kind source_development_install --role source
          --platform linux-x86_64 --python-minor 3.13
          --full-python-suite PASS
          --full-python-suite-log qualification/rust-ir-2/full-pytest.log
          --root "${{ github.workspace }}" --repository "${{ github.workspace }}"
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ir-2-source-install
          path: |
            qualification/rust-ir-2/source.json
            qualification/rust-ir-2/full-pytest.log

  next-request-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt 'maturin>=1.9.4,<2'
      - run: python -m pip install compiler-rs/distributions/aether-compiler-core
      - run: python -m pip install -e . --no-deps
      - run: >-
          python scripts/rust_ir_2_product_probe.py --mode recovery
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-recovery, path: qualification/rust-ir-2/recovery.json}

  transport-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt 'maturin>=1.9.4,<2'
      - run: python -m pip install compiler-rs/distributions/aether-compiler-core
      - run: python -m pip install -e . --no-deps
      - run: >-
          python scripts/rust_ir_2_product_probe.py --mode transport
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/transport.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-transport, path: qualification/rust-ir-2/transport.json}

  performance-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt
      - run: cargo build --manifest-path compiler-rs/Cargo.toml --locked --package aether-ir-verifier
      - run: >-
          python scripts/qualify_rust_ir_2_pre_lifecycle.py --mode performance
          --rust-verifier compiler-rs/target/debug/aether-ir-verifier --samples 9
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output qualification/rust-ir-2/performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rust-ir-2-performance, path: qualification/rust-ir-2/performance.json}

  platform-qualification:
    name: platform-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-latest}
          - {platform: windows-x86_64, os: windows-latest}
          - {platform: macos-x86_64, os: macos-15-intel}
          - {platform: macos-arm64, os: macos-15}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install 'maturin>=1.9.4,<2' 'build>=1.2,<2'
      - run: python -m pip wheel --no-build-isolation --no-deps compiler-rs/distributions/aether-compiler-core --wheel-dir native-dist
      - run: python -m build --wheel --outdir language-dist
      - shell: bash
        run: >-
          python scripts/qualify_rust_ir_2_clean_consumer.py
          --native-wheel native-dist/*.whl --language-wheel language-dist/*.whl
          --kind platform_qualification --role platform
          --platform "${{ matrix.platform }}" --python-minor 3.13
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output "qualification/rust-ir-2/platform-${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ir-2-platform-${{ matrix.platform }}
          path: qualification/rust-ir-2/platform-${{ matrix.platform }}.json

  python-compatibility:
    name: python-${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install 'maturin>=1.9.4,<2' 'build>=1.2,<2'
      - run: python -m pip wheel --no-build-isolation --no-deps compiler-rs/distributions/aether-compiler-core --wheel-dir native-dist
      - run: python -m build --wheel --outdir language-dist
      - shell: bash
        run: >-
          python scripts/qualify_rust_ir_2_clean_consumer.py
          --native-wheel native-dist/*.whl --language-wheel language-dist/*.whl
          --kind python_compatibility --role python_compatibility
          --platform linux-x86_64 --python-minor "${{ matrix.python }}"
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --output "qualification/rust-ir-2/python-${{ matrix.python }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ir-2-python-${{ matrix.python }}
          path: qualification/rust-ir-2/python-${{ matrix.python }}.json

  aggregate-fail-closed:
    if: always()
    needs:
      - contract-and-baseline
      - rust-verifier-unit
      - valid-corpus-differential
      - mutation-campaign
      - critical-irv041-regressions
      - production-pre-lifecycle-provenance
      - lifecycle-boundary-regression
      - packaged-clean-consumer
      - source-development-install
      - next-request-recovery
      - transport-continuity
      - performance-characterization
      - platform-qualification
      - python-compatibility
    runs-on: ubuntu-latest
    env:
      RESULT_CONTRACT: ${{ needs.contract-and-baseline.result }}
      RESULT_RUST: ${{ needs.rust-verifier-unit.result }}
      RESULT_VALID: ${{ needs.valid-corpus-differential.result }}
      RESULT_MUTATIONS: ${{ needs.mutation-campaign.result }}
      RESULT_IRV041: ${{ needs.critical-irv041-regressions.result }}
      RESULT_PROVENANCE: ${{ needs.production-pre-lifecycle-provenance.result }}
      RESULT_LIFECYCLE: ${{ needs.lifecycle-boundary-regression.result }}
      RESULT_PACKAGED: ${{ needs.packaged-clean-consumer.result }}
      RESULT_SOURCE: ${{ needs.source-development-install.result }}
      RESULT_RECOVERY: ${{ needs.next-request-recovery.result }}
      RESULT_TRANSPORT: ${{ needs.transport-continuity.result }}
      RESULT_PERFORMANCE: ${{ needs.performance-characterization.result }}
      RESULT_PLATFORM: ${{ needs.platform-qualification.result }}
      RESULT_PYTHON: ${{ needs.python-compatibility.result }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rust-ir-2-*
          path: qualification/aggregate/downloaded
      - name: Record exact mandatory job conclusions
        run: >-
          python -c "import json,os,pathlib;
          keys={'contract-and-baseline':'RESULT_CONTRACT','rust-verifier-unit':'RESULT_RUST','valid-corpus-differential':'RESULT_VALID','mutation-campaign':'RESULT_MUTATIONS','critical-irv041-regressions':'RESULT_IRV041','production-pre-lifecycle-provenance':'RESULT_PROVENANCE','lifecycle-boundary-regression':'RESULT_LIFECYCLE','packaged-clean-consumer':'RESULT_PACKAGED','source-development-install':'RESULT_SOURCE','next-request-recovery':'RESULT_RECOVERY','transport-continuity':'RESULT_TRANSPORT','performance-characterization':'RESULT_PERFORMANCE','platform-qualification':'RESULT_PLATFORM','python-compatibility':'RESULT_PYTHON'};
          p=pathlib.Path('qualification/aggregate/job-results.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps({k:os.environ[v] for k,v in keys.items()},sort_keys=True)+'\n')"
      - name: Download official artifact API records and ZIPs
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p qualification/aggregate/zips
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > qualification/aggregate/artifacts-api.json
          shopt -s nullglob
          for directory in qualification/aggregate/downloaded/rust-ir-2-*; do
            name="$(basename "$directory")"
            id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$name\") | .id")"
            test -n "$id"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "qualification/aggregate/zips/${name}.zip"
          done
      - name: Build official manifest and decide fail-closed
        run: |
          python scripts/build_rust_ir_2_artifact_manifest.py \
            --api qualification/aggregate/artifacts-api.json \
            --downloaded qualification/aggregate/downloaded \
            --zips qualification/aggregate/zips \
            --job-results qualification/aggregate/job-results.json \
            --revision "${{ github.sha }}" --run-id "${{ github.run_id }}" \
            --output qualification/aggregate/artifact-manifest.json
          python scripts/check_rust_ir_2_pre_lifecycle_shadow_qualification.py \
            --manifest qualification/aggregate/artifact-manifest.json \
            --output qualification/aggregate/decision.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ir-2-aggregate
          path: qualification/aggregate

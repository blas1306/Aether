name: core-in-process-production-transport-promotion

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AETHER_COMPILER_CORE_BUILD_IDENTITY: ${{ github.sha }}

jobs:
  blocker-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Recompute the exact CORE-PKG-1 closure
        run: >-
          python scripts/check_core_pkg_1_native_distribution_closure_77417e77.py
          --require-qualified
          --output qualification/core-1.0b/blocker-resolution.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-1-0b-blocker-resolution
          path: qualification/core-1.0b/blocker-resolution.json

  production-default-in-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python -m pytest -q tests/aether/test_core_1_0b_in_process_transport.py -k 'default or policy or provenance'

  explicit-companion-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=src AETHER_RUST_CORE_TRANSPORT=companion python -m pytest -q tests/aether/test_core_1_0b_in_process_transport.py -k 'companion or rollback'

  no-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python -m pytest -q tests/aether/test_core_1_0b_in_process_transport.py -k 'broken or missing or hidden or invalid'

  sessions-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python -m pytest -q tests/aether/test_core_1_0b_in_process_transport.py tests/aether/test_core_1_0_in_process_boundary.py -k 'reuse or concurrent or session or one_productive'

  differential-both-transports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python -m pytest -q tests/aether/test_core_1_0b_in_process_transport.py -k 'orthogonal'

  affected-rust-4-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest 'maturin>=1.9.4,<2'
      - run: python -m pip install --no-build-isolation compiler-rs/distributions/aether-compiler-core
      - run: >-
          PYTHONPATH=src python -m pytest -q
          tests/aether/test_core_1_0b_in_process_transport.py
          tests/aether/test_core_1_0b_wheel_install.py
          tests/aether/test_rust_ssa_shadow_mode.py
          tests/aether/test_rust_ssa_shadow_independent_production_promotion.py
          tests/aether/test_rust_ssa_shadow_independent_qualification.py

  transport-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest 'maturin>=1.9.4,<2'
      - run: python -m pip install --no-build-isolation compiler-rs/distributions/aether-compiler-core
      - run: python -m pip install -e . --no-deps
      - run: >-
          python scripts/qualify_core_1_0b_in_process_transport.py
          --revision "${{ github.sha }}"
          --ci-run-id "${{ github.run_id }}"
          --output qualification/core-1.0b/functional.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: core-1-0b-functional, path: qualification/core-1.0b/functional.json}

  production-pipeline:
    needs: transport-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest 'maturin>=1.9.4,<2'
      - run: python -m pip install --no-build-isolation compiler-rs/distributions/aether-compiler-core
      - run: >-
          PYTHONPATH=src python -m pytest -q
          tests/aether/test_pipeline.py
          tests/aether/test_expense_tracker_example.py
          tests/aether/test_numerical_methods_example.py

  packaging-regression:
    name: packaged-clean-consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install 'maturin>=1.9.4,<2' 'build>=1.2,<2'
      - run: python -m pip wheel --no-build-isolation --no-deps compiler-rs/distributions/aether-compiler-core --wheel-dir native-dist
      - run: python -m build --wheel --outdir language-dist
      - name: Install exact wheels into a clean consumer
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/core-1-0b-consumer"
          python -m venv "$consumer"
          python scripts/install_core_1_0b_wheels.py --python "$consumer/bin/python"
          cp scripts/core_1_0b_packaged_consumer_probe.py "$RUNNER_TEMP/core_1_0b_packaged_consumer_probe.py"
      - name: Default wheel consumer observes in-process without a toolchain
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/core-1-0b-consumer"
          mkdir -p "$RUNNER_TEMP/no-toolchain"
          cd "$RUNNER_TEMP"
          PATH="$consumer/bin:$RUNNER_TEMP/no-toolchain" "$consumer/bin/python" -I core_1_0b_packaged_consumer_probe.py \
            --expected-transport in_process --expect-default \
            --forbidden-root "$GITHUB_WORKSPACE" --revision "${{ github.sha }}" \
            --ci-run-id "${{ github.run_id }}" \
            --output core-1.0b-packaged-default.json
      - name: Same wheel consumer observes explicit companion without PyO3 execution
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/core-1-0b-consumer"
          cd "$RUNNER_TEMP"
          PATH="$consumer/bin:$RUNNER_TEMP/no-toolchain" AETHER_RUST_CORE_TRANSPORT=companion \
            "$consumer/bin/python" -I core_1_0b_packaged_consumer_probe.py \
            --expected-transport companion \
            --forbidden-root "$GITHUB_WORKSPACE" --revision "${{ github.sha }}" \
            --ci-run-id "${{ github.run_id }}" \
            --output core-1.0b-packaged-companion.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-1-0b-packaged-consumer
          path: ${{ runner.temp }}/core-1.0b-packaged-*.json

  clean-install-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-latest}
          - {platform: windows-x86_64, os: windows-latest}
          - {platform: macos-x86_64, os: macos-15-intel}
          - {platform: macos-arm64, os: macos-15}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest 'maturin>=1.9.4,<2' 'build>=1.2,<2'
      - run: python -m pip wheel --no-build-isolation --no-deps compiler-rs/distributions/aether-compiler-core --wheel-dir native-dist
      - run: python -m build --wheel --outdir language-dist
      - run: python scripts/install_core_1_0b_wheels.py
      - shell: bash
        run: >-
          python scripts/qualify_core_1_0b_in_process_transport.py --smoke
          --revision "${{ github.sha }}" --ci-run-id "${{ github.run_id }}"
          --platform "${{ matrix.platform }}" --matrix-role platform
          --output "qualification/core-1.0b/platform-${{ matrix.platform }}.json"
      - name: Wheel-only default and rollback consumers
        shell: bash
        run: |
          runtime="$(python -c 'import sys; print(sys.executable)')"
          isolated="$RUNNER_TEMP/core-1-0b-platform-${{ matrix.platform }}"
          no_toolchain="$isolated/no-toolchain"
          mkdir -p "$no_toolchain"
          cp scripts/core_1_0b_packaged_consumer_probe.py "$isolated/probe.py"
          cd "$isolated"
          PATH="$no_toolchain" "$runtime" -I probe.py \
            --expected-transport in_process --expect-default \
            --forbidden-root "$GITHUB_WORKSPACE" --revision "${{ github.sha }}" \
            --ci-run-id "${{ github.run_id }}" --platform "${{ matrix.platform }}" \
            --python-minor 3.13 \
            --output "$GITHUB_WORKSPACE/qualification/core-1.0b/consumer-${{ matrix.platform }}-in-process.json"
          PATH="$no_toolchain" AETHER_RUST_CORE_TRANSPORT=companion "$runtime" -I probe.py \
            --expected-transport companion \
            --forbidden-root "$GITHUB_WORKSPACE" --revision "${{ github.sha }}" \
            --ci-run-id "${{ github.run_id }}" --platform "${{ matrix.platform }}" \
            --python-minor 3.13 \
            --output "$GITHUB_WORKSPACE/qualification/core-1.0b/consumer-${{ matrix.platform }}-companion.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-1-0b-platform-${{ matrix.platform }}
          path: qualification/core-1.0b/*.json

  python-compatibility:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest 'maturin>=1.9.4,<2' 'build>=1.2,<2'
      - run: python -m pip wheel --no-build-isolation --no-deps compiler-rs/distributions/aether-compiler-core --wheel-dir native-dist
      - run: python -m build --wheel --outdir language-dist
      - run: python scripts/install_core_1_0b_wheels.py
      - run: >-
          python scripts/qualify_core_1_0b_in_process_transport.py --smoke
          --revision "${{ github.sha }}" --ci-run-id "${{ github.run_id }}"
          --platform linux-x86_64 --python-minor "${{ matrix.python }}"
          --matrix-role python_compatibility
          --output "qualification/core-1.0b/python-${{ matrix.python }}.json"
      - name: Wheel-only default and rollback consumers
        shell: bash
        run: |
          runtime="$(python -c 'import sys; print(sys.executable)')"
          isolated="$RUNNER_TEMP/core-1-0b-python-${{ matrix.python }}"
          no_toolchain="$isolated/no-toolchain"
          mkdir -p "$no_toolchain"
          cp scripts/core_1_0b_packaged_consumer_probe.py "$isolated/probe.py"
          cd "$isolated"
          PATH="$no_toolchain" "$runtime" -I probe.py \
            --expected-transport in_process --expect-default \
            --forbidden-root "$GITHUB_WORKSPACE" --revision "${{ github.sha }}" \
            --ci-run-id "${{ github.run_id }}" --platform linux-x86_64 \
            --python-minor "${{ matrix.python }}" \
            --output "$GITHUB_WORKSPACE/qualification/core-1.0b/consumer-python-${{ matrix.python }}-in-process.json"
          PATH="$no_toolchain" AETHER_RUST_CORE_TRANSPORT=companion "$runtime" -I probe.py \
            --expected-transport companion \
            --forbidden-root "$GITHUB_WORKSPACE" --revision "${{ github.sha }}" \
            --ci-run-id "${{ github.run_id }}" --platform linux-x86_64 \
            --python-minor "${{ matrix.python }}" \
            --output "$GITHUB_WORKSPACE/qualification/core-1.0b/consumer-python-${{ matrix.python }}-companion.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-1-0b-python-${{ matrix.python }}
          path: qualification/core-1.0b/*.json

  source-development-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.85"}
      - run: python -m pip install -r requirements.txt pytest 'maturin>=1.9.4,<2'
      - name: Apply the qualified CORE-PKG-1 development install procedure
        run: |
          python -m pip install compiler-rs/distributions/aether-compiler-core
          python -m pip install -e . --no-deps
      - name: Default in-process and explicit companion development smoke
        shell: bash
        run: |
          python scripts/qualify_core_1_0b_in_process_transport.py --smoke \
            --revision "${{ github.sha }}" --ci-run-id "${{ github.run_id }}" \
            --matrix-role development_install \
            --output qualification/core-1.0b/development-install.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-1-0b-development-install
          path: qualification/core-1.0b/development-install.json

  aggregate-fail-closed:
    if: always()
    needs:
      - blocker-resolution
      - production-default-in-process
      - explicit-companion-rollback
      - transport-parity
      - differential-both-transports
      - production-pipeline
      - no-fallback
      - sessions-concurrency
      - affected-rust-4-5
      - packaging-regression
      - clean-install-platform
      - python-compatibility
      - source-development-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every promotion prerequisite
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - uses: actions/download-artifact@v4
        if: always()
        with: {pattern: core-1-0b-*, path: qualification/core-1.0b, merge-multiple: true}
      - if: always()
        run: >-
          python scripts/check_core_1_0b_in_process_transport.py
          --evidence-dir qualification/core-1.0b
          --revision "${{ github.sha }}"
          --ci-closure --require-promoted
          --output qualification/core-1.0b/aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: core-1-0b-aggregate, path: qualification/core-1.0b/aggregate.json}
